services:
  - type: web
    name: medical-tailoring-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: STORAGE_DIR
        value: /app/storage

  - type: web
    name: medical-tailoring-ui
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: medical-tailoring-api
          property: host
